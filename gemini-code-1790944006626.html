<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portail - Book | Carrefour Proximité</title>
  <!-- SDK Supabase & Libs JS (Barcode + Excel Parser) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  
  <style>
    :root {
      --primary-color: #004B30;
      --primary-hover: #003622;
      --accent-color: #028090;
      --bg-color: #F8F9FA;
      --card-bg: #FFFFFF;
      --text-main: #1A1A1A;
      --text-muted: #6C757D;
      --border-color: #E9ECEF;
      --danger-color: #D90429;
      --radius: 12px;
      --shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-main); display: flex; flex-direction: column; min-height: 100vh; }
    header { background-color: var(--card-bg); border-bottom: 2px solid var(--border-color); padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; }
    .brand { display: flex; align-items: center; gap: 12px; }
    .brand-logo { width: 14px; height: 24px; background-color: var(--primary-color); border-radius: 2px; }
    .brand-title { font-size: 1.25rem; font-weight: 700; color: var(--primary-color); letter-spacing: -0.5px; }
    .admin-toggle { background: transparent; border: 1px solid var(--border-color); padding: 0.5rem 1rem; border-radius: 20px; cursor: pointer; font-size: 0.85rem; color: var(--text-muted); transition: all 0.2s; }
    .admin-toggle:hover, .admin-toggle.active { background-color: var(--primary-color); color: white; border-color: var(--primary-color); }
    main { flex: 1; max-width: 1100px; width: 100%; margin: 0 auto; padding: 2.5rem 1.5rem; }
    .page { display: none; animation: fadeIn 0.3s ease-in-out; }
    .page.active { display: block; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .page-title { font-size: 2rem; color: var(--primary-color); text-align: center; margin-bottom: 0.5rem; font-weight: 800; }
    .page-subtitle { text-align: center; color: var(--text-muted); margin-bottom: 2.5rem; font-size: 1.1rem; }
    .button-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 1.5rem; max-width: 800px; margin: 0 auto; }
    .big-btn { background: var(--card-bg); border: 2px solid var(--border-color); border-radius: var(--radius); padding: 2.5rem 2rem; text-align: center; cursor: pointer; transition: all 0.25s ease; box-shadow: var(--shadow); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; }
    .big-btn:hover { border-color: var(--primary-color); transform: translateY(-4px); box-shadow: 0 8px 25px rgba(0, 75, 48, 0.12); }
    .big-btn-title { font-size: 1.35rem; font-weight: 700; color: var(--primary-color); }
    .big-btn-subtitle { font-size: 0.95rem; color: var(--text-muted); }
    .breadcrumb { display: flex; align-items: center; gap: 8px; margin-bottom: 1.5rem; font-size: 0.9rem; color: var(--text-muted); }
    .breadcrumb-link { color: var(--primary-color); text-decoration: none; cursor: pointer; font-weight: 600; }
    .breadcrumb-link:hover { text-decoration: underline; }
    .results-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; flex-wrap: wrap; gap: 1rem; }
    .search-container { margin-bottom: 1.5rem; display: flex; gap: 10px; }
    .search-input { flex: 1; padding: 12px 16px; font-size: 1rem; border: 2px solid var(--border-color); border-radius: 8px; outline: none; transition: border-color 0.2s; }
    .search-input:focus { border-color: var(--primary-color); }
    .select-filter { padding: 12px 16px; font-size: 1rem; border: 2px solid var(--border-color); border-radius: 8px; background: white; outline: none; }
    .view-switch { display: flex; background: var(--border-color); padding: 4px; border-radius: 8px; }
    .view-btn { border: none; background: transparent; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: 600; color: var(--text-muted); transition: all 0.2s; }
    .view-btn.active { background: var(--card-bg); color: var(--primary-color); box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    .add-book-btn { background: var(--primary-color); color: white; border: none; padding: 10px 20px; border-radius: 8px; font-weight: 600; cursor: pointer; display: none; transition: background 0.2s; }
    .add-book-btn:hover { background: var(--primary-hover); }
    .books-container.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1.5rem; }
    .books-container.list { display: flex; flex-direction: column; gap: 1rem; }
    .book-card { background: var(--card-bg); border-radius: var(--radius); border: 1px solid var(--border-color); overflow: hidden; box-shadow: var(--shadow); display: flex; flex-direction: column; transition: transform 0.2s, box-shadow 0.2s; position: relative; }
    .book-card:hover { transform: translateY(-3px); box-shadow: 0 6px 20px rgba(0,0,0,0.08); }
    .book-cover { width: 100%; height: 180px; object-fit: cover; background-color: #EEE; }
    .book-content { padding: 1.25rem; display: flex; flex-direction: column; flex: 1; }
    .book-title { font-size: 1.15rem; font-weight: 700; color: var(--primary-color); margin-bottom: 0.5rem; }
    .book-desc { font-size: 0.9rem; color: var(--text-muted); margin-bottom: 1.25rem; flex: 1; line-height: 1.4; }
    .drive-link { display: inline-flex; align-items: center; justify-content: center; gap: 8px; background: var(--primary-color); color: white; text-decoration: none; padding: 10px; border-radius: 6px; font-weight: 600; font-size: 0.9rem; text-align: center; transition: background 0.2s; cursor: pointer; border: none; }
    .drive-link:hover { background: var(--primary-hover); }
    .books-container.list .book-card { flex-direction: row; align-items: center; height: 120px; }
    .books-container.list .book-cover { width: 140px; height: 100%; }
    .books-container.list .book-content { flex-direction: row; align-items: center; justify-content: space-between; width: 100%; gap: 1rem; }
    .books-container.list .book-desc { margin-bottom: 0; max-width: 40%; }
    
    /* VUE CATALOGUE PRODUIT */
    .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 1.25rem; margin-top: 1.5rem; }
    .product-card { background: var(--card-bg); border-radius: 8px; border: 1px solid var(--border-color); padding: 1rem; display: flex; flex-direction: column; align-items: center; justify-content: space-between; text-align: center; box-shadow: var(--shadow); }
    .product-img { width: 130px; height: 130px; object-fit: contain; image-rendering: -webkit-optimize-contrast; margin-bottom: 10px; }
    .product-title { font-size: 0.95rem; font-weight: 700; color: var(--text-main); margin-bottom: 8px; height: 2.6em; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
    .product-badge { background: #E9ECEF; color: var(--primary-color); padding: 3px 8px; border-radius: 12px; font-size: 0.75rem; font-weight: 700; margin-bottom: 10px; }
    .barcode-svg { width: 100%; height: 50px; }

    .admin-actions { display: none; gap: 6px; position: absolute; top: 10px; right: 10px; }
    .admin-mode .admin-actions { display: flex; }
    .btn-action { background: rgba(255, 255, 255, 0.9); border: 1px solid var(--border-color); padding: 6px 10px; border-radius: 4px; cursor: pointer; font-size: 0.8rem; font-weight: 600; }
    .btn-action.delete { color: var(--danger-color); }
    .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0, 0, 0, 0.5); display: none; align-items: center; justify-content: center; z-index: 1000; padding: 1rem; }
    .modal-overlay.active { display: flex; }
    .modal { background: var(--card-bg); padding: 2rem; border-radius: var(--radius); width: 100%; max-width: 550px; max-height: 90vh; overflow-y: auto; box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
    .modal-title { font-size: 1.4rem; color: var(--primary-color); margin-bottom: 1.5rem; }
    .form-group { margin-bottom: 1.25rem; }
    .form-group label { display: block; font-weight: 600; margin-bottom: 0.4rem; font-size: 0.9rem; }
    .form-group input, .form-group textarea { width: 100%; padding: 10px; border: 1px solid var(--border-color); border-radius: 6px; font-size: 0.95rem; }
    .checkbox-group { display: flex; flex-direction: column; gap: 8px; background: var(--bg-color); padding: 10px; border-radius: 6px; }
    .checkbox-label { display: flex; align-items: center; gap: 8px; font-weight: normal; cursor: pointer; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 1.5rem; }
    .btn-secondary { background: #E0E0E0; border: none; padding: 10px 18px; border-radius: 6px; cursor: pointer; font-weight: 600; }

    @media print {
      header, .breadcrumb, .results-header, .search-container, .admin-toggle, .no-print { display: none !important; }
      body { background: white; }
      main { max-width: 100%; padding: 0; }
      .product-grid { grid-template-columns: repeat(3, 1fr) !important; gap: 10px; page-break-inside: avoid; }
      .product-card { border: 1px solid #ccc; box-shadow: none; page-break-inside: avoid; }
    }
  </style>
</head>
<body>
  <header>
    <div class="brand"><div class="brand-logo"></div><div class="brand-title">Carrefour Proximité</div></div>
    <button class="admin-toggle" id="adminToggleBtn" onclick="toggleAdminMode()">Accès Éditeur</button>
  </header>

  <main>
    <!-- PAGE 1 : SÉLECTION ENTREPÔT -->
    <section id="page1" class="page active">
      <h1 class="page-title">Portail - Book</h1>
      <p class="page-subtitle">Veuillez sélectionner votre entrepôt / secteur</p>
      
      <div class="button-grid">
        <button class="big-btn" onclick="selectSector('NORD')"><span class="big-btn-title">St-Vulbas, Bagé, Mâcon</span><span class="big-btn-subtitle">(Secteur Nord)</span></button>
        <button class="big-btn" onclick="selectSector('SALON')"><span class="big-btn-title">Salon</span><span class="big-btn-subtitle">(Secteur Sud)</span></button>
      </div>
    </section>

    <!-- PAGE 2 : SÉLECTION FORMAT -->
    <section id="page2" class="page">
      <div class="breadcrumb"><span class="breadcrumb-link" onclick="goToPage(1)">← Portail - Book</span><span>/</span><span id="selectedSectorBreadcrumb"></span></div>
      
      <h1 class="page-title">Format de Magasin</h1>
      <p class="page-subtitle">Sélectionnez la typologie de votre point de vente</p>
      
      <div class="button-grid">
        <button class="big-btn" onclick="selectFormat('63')"><span class="big-btn-title">63 - Rural</span><span class="big-btn-subtitle">Contact - Express rural</span></button>
        <button class="big-btn" onclick="selectFormat('70')"><span class="big-btn-title">70 - Urbain</span><span class="big-btn-subtitle">Express urbain - City - Montagne</span></button>
      </div>
    </section>

    <!-- PAGE 3 : LISTE DES BOOKS -->
    <section id="page3" class="page">
      <div class="breadcrumb"><span class="breadcrumb-link" onclick="goToPage(1)">Portail</span><span>/</span><span class="breadcrumb-link" id="breadcrumbSector" onclick="goToPage(2)"></span><span>/</span><span id="breadcrumbFormat"></span></div>
      
      <div class="results-header">
        <div>
          <h1 class="page-title" style="text-align: left; margin:0;">Books Produits</h1>
          <p id="resultsSubtitle" style="color: var(--text-muted); font-size: 0.9rem; margin-top: 4px;"></p>
        </div>
        <div style="display: flex; gap: 10px; align-items: center;">
          <button class="add-book-btn" id="addBookBtn" onclick="openModal()">+ Ajouter un Book</button>
          <div class="view-switch">
            <button class="view-btn active" id="btnViewGrid" onclick="setViewMode('grid')">Vue Grille</button>
            <button class="view-btn" id="btnViewList" onclick="setViewMode('list')">Vue Liste</button>
          </div>
        </div>
      </div>
      
      <div class="search-container">
        <input type="text" id="searchInput" class="search-input" placeholder="🔍 Rechercher un book par nom ou mot-clé..." oninput="renderBooks()">
      </div>
      
      <div id="booksContainer" class="books-container grid"></div>
    </section>

    <!-- PAGE 4 : VUE INTERACTIVE DES PRODUITS DU BOOK -->
    <section id="page4" class="page">
      <div class="breadcrumb no-print">
        <span class="breadcrumb-link" onclick="goToPage(3)">← Retour aux Books</span>
        <span>/</span>
        <span id="breadcrumbBookTitle" style="font-weight: 700; color: var(--primary-color);"></span>
      </div>

      <div class="results-header">
        <div>
          <h1 class="page-title" id="catalogBookTitle" style="text-align: left; margin:0;"></h1>
          <p id="catalogBookDesc" style="color: var(--text-muted); font-size: 0.9rem; margin-top: 4px;"></p>
        </div>
        <button class="drive-link no-print" onclick="window.print()">🖨️ Exporter en PDF</button>
      </div>

      <div class="search-container no-print">
        <input type="text" id="productSearchInput" class="search-input" placeholder="🔍 Rechercher un produit par libellé ou EAN..." oninput="renderProducts()">
        <select id="assortmentFilter" class="select-filter" onchange="renderProducts()">
          <option value="">Tous les assortiments</option>
          <option value="A">Assortiment A</option>
          <option value="B">Assortiment B</option>
          <option value="C">Assortiment C</option>
          <option value="D">Assortiment D</option>
        </select>
      </div>

      <div id="productsContainer" class="product-grid"></div>
    </section>
  </main>

  <!-- MODAL AJOUT / EDIT BOOK (ADMIN) -->
  <div class="modal-overlay" id="bookModal">
    <div class="modal">
      <h2 class="modal-title" id="modalTitle">Ajouter un Book</h2>
      <form id="bookForm" onsubmit="handleFormSubmit(event)">
        <input type="hidden" id="bookId">
        
        <div class="form-group">
          <label for="bookTitle">Titre du Book *</label>
          <input type="text" id="bookTitle" required placeholder="ex: EPICERIE SUCREE">
        </div>
        <div class="form-group">
          <label for="bookImage">Lien URL de l'image de couverture</label>
          <input type="url" id="bookImage" placeholder="https://..." onchange="previewImage(this.value)">
          <img id="imagePreview" style="width: 100%; max-height: 120px; object-fit: cover; border-radius: 6px; margin-top: 8px; display: none;" alt="Aperçu">
        </div>
        <div class="form-group">
          <label for="bookDesc">Description / Consignes</label>
          <textarea id="bookDesc" rows="2" placeholder="Informations importantes sur ce catalogue..."></textarea>
        </div>
        <div class="form-group">
          <label>Assigner aux Secteurs (Entrepôts) *</label>
          <div class="checkbox-group">
            <label class="checkbox-label"><input type="checkbox" name="sector" value="NORD"> St-Vulbas, Bagé, Mâcon (Nord)</label>
            <label class="checkbox-label"><input type="checkbox" name="sector" value="SALON"> Salon</label>
          </div>
        </div>
        <div class="form-group">
          <label>Assigner aux Formats *</label>
          <div class="checkbox-group">
            <label class="checkbox-label"><input type="checkbox" name="format" value="63"> 63 - Rural (Contact - Express rural)</label>
            <label class="checkbox-label"><input type="checkbox" name="format" value="70"> 70 - Urbain (Express urbain - City - Montagne)</label>
          </div>
        </div>
        <div class="form-group">
          <label for="excelFile">Importer un fichier Cadencier Excel (.xlsx)</label>
          <input type="file" id="excelFile" accept=".xlsx, .xls">
          <small style="color: var(--text-muted); font-size: 0.8rem; display: block; margin-top: 4px;">Colonnes gérées : Libelle, EAN, Assortiment, Image</small>
        </div>

        <div class="modal-actions">
          <button type="button" class="btn-secondary" onclick="closeModal()">Annuler</button>
          <button type="submit" class="add-book-btn" id="saveSubmitBtn" style="display: block;">Enregistrer</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    // CONFIGURATION SUPABASE
    const SUPABASE_URL = 'https://lmgwcbxbcbcxcorcvwrw.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_SS_pQlUPdaXqhCSM3NgmvA_bnyUjG6m';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let state = { sector: null, format: null, isAdmin: false, viewMode: 'grid', books: [], currentBook: null, parsedProducts: [] };
    const LABELS = { NORD: "St-Vulbas, Bagé, Mâcon (Nord)", SALON: "Salon", '63': "63 - Rural", '70': "70 - Urbain" };

    function formatDriveImageUrl(url) {
      if (!url) return '';
      if (url.includes('drive.google.com') && url.includes('/file/d/')) {
        const fileId = url.split('/file/d/')[1].split('/')[0];
        return `https://lh3.googleusercontent.com/d/${fileId}`;
      }
      return url;
    }

    async function fetchBooks() {
      try {
        const { data, error } = await supabaseClient.from('books').select('*').order('created_at', { ascending: true });
        if (error) throw error;
        state.books = data || [];
      } catch (err) {
        console.error("Erreur de chargement Supabase :", err);
      }
      renderBooks();
    }

    function goToPage(pageNumber) {
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      document.getElementById(`page${pageNumber}`).classList.add('active');
    }

    function selectSector(sectorKey) {
      state.sector = sectorKey;
      document.getElementById('selectedSectorBreadcrumb').textContent = LABELS[sectorKey];
      goToPage(2);
    }

    function selectFormat(formatKey) {
      state.format = formatKey;
      document.getElementById('breadcrumbSector').textContent = LABELS[state.sector];
      document.getElementById('breadcrumbFormat').textContent = LABELS[formatKey];
      document.getElementById('resultsSubtitle').textContent = `${LABELS[state.sector]} | ${LABELS[state.format]}`;
      document.getElementById('searchInput').value = '';
      renderBooks();
      goToPage(3);
    }

    function toggleAdminMode() {
      if (!state.isAdmin) {
        const pass = prompt("Saisissez le mot de passe Éditeur :");
        if (pass === 'CMPGC') {
          state.isAdmin = true;
          document.getElementById('adminToggleBtn').textContent = "Quitter Mode Éditeur";
          document.getElementById('adminToggleBtn').classList.add('active');
          document.getElementById('addBookBtn').style.display = 'block';
          document.body.classList.add('admin-mode');
        } else if (pass !== null) {
          alert("Mot de passe incorrect.");
        }
      } else {
        state.isAdmin = false;
        document.getElementById('adminToggleBtn').textContent = "Accès Éditeur";
        document.getElementById('adminToggleBtn').classList.remove('active');
        document.getElementById('addBookBtn').style.display = 'none';
        document.body.classList.remove('admin-mode');
      }
      renderBooks();
    }

    function setViewMode(mode) {
      state.viewMode = mode;
      const container = document.getElementById('booksContainer');
      document.getElementById('btnViewGrid').classList.toggle('active', mode === 'grid');
      document.getElementById('btnViewList').classList.toggle('active', mode === 'list');
      container.className = `books-container ${mode}`;
    }

    function renderBooks() {
      const container = document.getElementById('booksContainer');
      container.innerHTML = '';
      const query = (document.getElementById('searchInput')?.value || '').toLowerCase().trim();

      const filteredBooks = state.books.filter(book => {
        const matchSector = book.sectors && book.sectors.includes(state.sector);
        const matchFormat = book.formats && book.formats.includes(state.format);
        const matchQuery = !query || 
          (book.title && book.title.toLowerCase().includes(query)) || 
          (book.description && book.description.toLowerCase().includes(query));
        return matchSector && matchFormat && matchQuery;
      });

      filteredBooks.sort((a, b) => (a.title || '').localeCompare(b.title || ''));

      if (filteredBooks.length === 0) {
        container.innerHTML = `<p style="grid-column: 1/-1; text-align: center; color: var(--text-muted); padding: 3rem;">${query ? 'Aucun book ne correspond à votre recherche.' : 'Aucun Book disponible pour cette sélection.'}</p>`;
        return;
      }

      filteredBooks.forEach(book => {
        const card = document.createElement('div');
        card.className = 'book-card';
        card.innerHTML = `
          ${state.isAdmin ? `<div class="admin-actions"><button class="btn-action" onclick="editBook('${book.id}')">Éditer</button><button class="btn-action delete" onclick="deleteBook('${book.id}')">Supprimer</button></div>` : ''}
          <img src="${formatDriveImageUrl(book.image)}" alt="${book.title}" class="book-cover" onerror="this.src='https://via.placeholder.com/600x400?text=Carrefour+Proximité'">
          <div class="book-content">
            <h3 class="book-title">${book.title}</h3>
            <p class="book-desc">${book.description || 'Catalogue des produits du rayon.'}</p>
            <button onclick="openCatalog('${book.id}')" class="drive-link">Accéder au book ↗</button>
          </div>
        `;
        container.appendChild(card);
      });
    }

    // OUVERTURE DE LA PAGE 4 (PRODUITS)
    function openCatalog(bookId) {
      const book = state.books.find(b => b.id === bookId);
      if (!book) return;

      state.currentBook = book;
      document.getElementById('breadcrumbBookTitle').textContent = book.title;
      document.getElementById('catalogBookTitle').textContent = book.title;
      document.getElementById('catalogBookDesc').textContent = book.description || '';
      document.getElementById('productSearchInput').value = '';
      document.getElementById('assortmentFilter').value = '';

      goToPage(4);
      renderProducts();
    }

    function renderProducts() {
      const container = document.getElementById('productsContainer');
      container.innerHTML = '';
      if (!state.currentBook || !state.currentBook.products) return;

      const query = (document.getElementById('productSearchInput')?.value || '').toLowerCase().trim();
      const assort = document.getElementById('assortmentFilter').value;

      const products = state.currentBook.products.filter(p => {
        const matchQuery = !query || (p.label && p.label.toLowerCase().includes(query)) || (p.ean && String(p.ean).includes(query));
        const matchAssort = !assort || p.assortment === assort;
        return matchQuery && matchAssort;
      });

      if (products.length === 0) {
        container.innerHTML = `<p style="grid-column: 1/-1; text-align: center; color: var(--text-muted); padding: 2rem;">Aucun produit ne correspond à ces critères.</p>`;
        return;
      }

      products.forEach((p, idx) => {
        const card = document.createElement('div');
        card.className = 'product-card';
        const barcodeId = `barcode-${idx}`;

        card.innerHTML = `
          <img src="${p.image || 'https://via.placeholder.com/130?text=Photo'}" class="product-img" alt="${p.label}">
          <div class="product-title">${p.label || 'Produit'}</div>
          <div class="product-badge">Assortiment : ${p.assortment || 'A'}</div>
          <svg id="${barcodeId}" class="barcode-svg"></svg>
        `;
        container.appendChild(card);

        if (p.ean) {
          try {
            JsBarcode(`#${barcodeId}`, String(p.ean), { format: "EAN13", height: 35, displayValue: true, fontSize: 11 });
          } catch(e) {
            JsBarcode(`#${barcodeId}`, String(p.ean), { format: "CODE128", height: 35, displayValue: true, fontSize: 11 });
          }
        }
      });
    }

    // GESTION LECTURE FICHIER EXCEL EN ADMIN
    document.getElementById('excelFile').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(evt) {
        const data = new Uint8Array(evt.target.result);
        const workbook = XLSX.read(data, { type: 'array' });
        const sheet = workbook.Sheets[workbook.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(sheet);

        state.parsedProducts = rows.map(r => ({
          label: r['Libelle'] || r['Libellé'] || r['Produit'] || r['Nom'] || '',
          ean: r['EAN'] || r['Code-barres'] || r['Code Barre'] || '',
          assortment: r['Assortiment'] || r['Assort'] || 'A',
          image: r['Image'] || r['Photo'] || ''
        }));

        alert(`${state.parsedProducts.length} produits extraits du fichier Excel !`);
      };
      reader.readAsArrayBuffer(file);
    });

    function previewImage(url) {
      const preview = document.getElementById('imagePreview');
      if (url) {
        preview.src = formatDriveImageUrl(url);
        preview.style.display = 'block';
      } else {
        preview.style.display = 'none';
      }
    }

    function openModal(editId = null) {
      const modal = document.getElementById('bookModal');
      document.getElementById('bookForm').reset();
      document.getElementById('imagePreview').style.display = 'none';
      state.parsedProducts = [];

      if (editId) {
        const book = state.books.find(b => b.id === editId);
        if (book) {
          document.getElementById('modalTitle').textContent = "Modifier le Book";
          document.getElementById('bookId').value = book.id;
          document.getElementById('bookTitle').value = book.title;
          document.getElementById('bookImage').value = book.image || '';
          document.getElementById('bookDesc').value = book.description || '';
          previewImage(book.image);
          document.querySelectorAll('input[name="sector"]').forEach(cb => cb.checked = book.sectors.includes(cb.value));
          document.querySelectorAll('input[name="format"]').forEach(cb => cb.checked = book.formats.includes(cb.value));
          state.parsedProducts = book.products || [];
        }
      } else {
        document.getElementById('modalTitle').textContent = "Ajouter un Book";
        document.getElementById('bookId').value = '';
        document.querySelectorAll('input[name="sector"]').forEach(cb => cb.checked = (cb.value === state.sector));
        document.querySelectorAll('input[name="format"]').forEach(cb => cb.checked = (cb.value === state.format));
      }
      modal.classList.add('active');
    }

    function closeModal() { document.getElementById('bookModal').classList.remove('active'); }

    async function handleFormSubmit(e) {
      e.preventDefault();
      const submitBtn = document.getElementById('saveSubmitBtn');
      submitBtn.disabled = true;
      submitBtn.textContent = "Sauvegarde...";

      const id = document.getElementById('bookId').value;
      const title = document.getElementById('bookTitle').value;
      const image = document.getElementById('bookImage').value;
      const description = document.getElementById('bookDesc').value;
      const sectors = Array.from(document.querySelectorAll('input[name="sector"]:checked')).map(cb => cb.value);
      const formats = Array.from(document.querySelectorAll('input[name="format"]:checked')).map(cb => cb.value);

      if (sectors.length === 0 || formats.length === 0) { 
        submitBtn.disabled = false; 
        submitBtn.textContent = "Enregistrer"; 
        return alert("Sélectionnez au moins un secteur et un format."); 
      }

      const payload = { title, image, description, sectors, formats, products: state.parsedProducts };

      let error = null;
      if (id) {
        const res = await supabaseClient.from('books').update(payload).eq('id', id);
        error = res.error;
      } else {
        const res = await supabaseClient.from('books').insert([payload]);
        error = res.error;
      }

      submitBtn.disabled = false;
      submitBtn.textContent = "Enregistrer";

      if (error) {
        alert("Erreur lors de la sauvegarde Supabase : " + error.message);
      } else {
        await fetchBooks();
        closeModal();
      }
    }

    function editBook(id) { openModal(id); }

    async function deleteBook(id) {
      if (confirm("Voulez-vous vraiment supprimer ce book ?")) {
        const { error } = await supabaseClient.from('books').delete().eq('id', id);
        if (error) alert("Erreur : " + error.message);
        else fetchBooks();
      }
    }

    // Lancement au démarrage
    fetchBooks();
  </script>
</body>
</html>
